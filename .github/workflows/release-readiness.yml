name: Release readiness

on:
  push:
    branches: ['codex/release-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentication:
    name: Native authentication (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Linux link dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --features ssh-auth-helper -- -D warnings
      - name: Native private IPC and secret lifecycle
        run: cargo test --features ssh-auth-helper ssh::auth:: -- --test-threads=1
      - name: Native ownership rejection before process launch
        run: cargo test --features ssh-auth-helper source_generation_is_checked_before_process_launch -- --test-threads=1
      - name: Build bundled helper
        run: cargo build --release --features ssh-auth-helper --bin congminal-ssh-helper

name: Release readiness

on:
  push:
    branches: ['codex/release-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentication:
    name: Native authentication (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Linux link dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev openssh-server
      - name: Format
        run: cargo fmt --check
      - name: Verified Microsoft ConPTY runtime
        if: runner.os == 'Windows'
        run: python ci/fetch-conpty.py --verify-signature --destination target/debug/deps --destination target/release
      - name: Clippy
        run: cargo clippy --all-targets --features sftp-preview -- -D warnings
      - name: Native private IPC and secret lifecycle
        run: |
          cargo test --features sftp-preview ssh::auth:: -- --test-threads=1
      - name: Native Windows local file ownership
        if: runner.os == 'Windows'
        run: |
          cargo test --features sftp-preview sftp::local_transfer::tests:: -- --test-threads=1
          cargo test --features sftp-preview sftp::service::windows_tests:: -- --test-threads=1
          cargo test --features sftp-preview sftp::local_plan::windows_tests:: -- --test-threads=1
      - name: Native ownership rejection before process launch
        run: cargo test --features sftp-preview source_generation_is_checked_before_process_launch -- --test-threads=1
      - name: Full native unit suite
        run: cargo test --features sftp-preview -- --test-threads=1
      - name: Build application and bundled helper
        run: cargo build --release --features sftp-preview
      - name: Native Windows OpenSSH, encrypted key and SFTP roundtrip
        if: runner.os == 'Windows'
        run: python ci/check-windows-sftp.py
      - name: Native Linux OpenSSH password and SFTP roundtrip
        if: runner.os == 'Linux'
        run: python3 ci/check-linux-password-sftp.py

name: CI

on:
  push:
    branches: [main, 'codex/release-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
          # Apple 芯片的运行机，同时交叉编译 Intel 版，合成通用二进制
          - name: macos-universal
            os: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: 安装 X11 开发库和测试工具
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev xvfb imagemagick openssh-server

      - name: 添加 macOS 编译目标
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: 格式检查
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test -- --test-threads=1

      - name: 校验发布版本
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo '标签和 Cargo 版本不一致'; exit 1; }

      - name: 编译 release
        if: runner.os != 'macOS'
        run: cargo build --release

      - name: 编译 release（通用二进制）
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/release
          for bin in congminal congminal-ssh-helper; do
            lipo -create -output "target/release/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
            lipo "target/release/$bin" -verify_arch arm64 x86_64
          done

      - name: 原生 Windows OpenSSH 与 SFTP 认证传输
        if: runner.os == 'Windows'
        run: python ci/check-windows-sftp.py

      - name: 原生 Linux OpenSSH 密码与 SFTP 认证传输
        if: runner.os == 'Linux'
        run: python3 ci/check-linux-password-sftp.py

      - name: 冒烟测试
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          # 等 Xvfb 准备好（固定 sleep 1 偶尔不够）
          for i in $(seq 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          DISPLAY=:99 ci/smoke.sh target/release/congminal smoke/${{ matrix.name }}.png

      - name: 冒烟测试
        if: runner.os == 'macOS'
        run: ci/smoke.sh target/release/congminal smoke/${{ matrix.name }}.png

      - name: 冒烟测试
        if: runner.os == 'Windows'
        shell: pwsh
        run: ci/smoke.ps1 -Bin target/release/congminal.exe -Shot smoke/${{ matrix.name }}.png

      - name: 上传冒烟测试截图
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-${{ matrix.name }}
          path: smoke/
          if-no-files-found: ignore

      - name: 打包
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          dir="congminal-$version-${{ matrix.name }}"
          if [ "$RUNNER_OS" = macOS ]; then
            bash ci/package-macos.sh --no-build --universal
            cp "target/distributions/$dir.zip" "target/distributions/$dir.zip.sha256" .
            exit 0
          fi
          mkdir -p "dist/$dir"
          cp README.md assets/fonts/LICENSE-Terminus.txt assets/congminal.example.toml "dist/$dir/"
          cp assets/shell/congminal.bash assets/shell/congminal.zsh "dist/$dir/"
          cp docs/releases/v0.1.0.md "dist/$dir/RELEASE-NOTES.md"
          printf 'version=%s\ncommit=%s\n' "$version" "$GITHUB_SHA" > "dist/$dir/BUILD.txt"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/congminal.exe target/release/congminal-ssh-helper.exe "dist/$dir/"
            [ "$("dist/$dir/congminal.exe" --version)" = "congminal $version" ]
            (cd dist && 7z a "../$dir.zip" "$dir")
            sha256sum "$dir.zip" > "$dir.zip.sha256"
          else
            cp target/release/congminal target/release/congminal-ssh-helper "dist/$dir/"
            [ "$("dist/$dir/congminal" --version)" = "congminal $version" ]
            tar -czf "$dir.tar.gz" -C dist "$dir"
            sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          fi

      - name: 上传安装包
        uses: actions/upload-artifact@v6
        with:
          name: congminal-${{ matrix.name }}
          path: |
            congminal-*.zip
            congminal-*.tar.gz
            congminal-*.sha256

  # 用 Cargo.toml 里声明的最低版本（rust-version）编译三个平台，防止不小心用了更新的 API
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装最低支持版本的 Rust
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal \
            --target x86_64-pc-windows-gnu,aarch64-apple-darwin,x86_64-apple-darwin

      - name: 编译检查
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            cargo +"$MSRV" check --all-targets --target "$target"
          done

  # 稳定标签发布正式版本，带 '-' 的标签保留预发布状态。
  release:
    needs: [build, msrv]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: congminal-*
          merge-multiple: true

      - name: 校验安装包并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for manifest in congminal-*.sha256; do sha256sum -c "$manifest"; done
          options=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" congminal-*.zip congminal-*.tar.gz congminal-*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "congminal $GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file docs/releases/v0.1.0.md \
            "${options[@]}"

[package]
name = "congminal"
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
default-run = "congminal"
description = "一个从零手写的跨平台终端模拟器（学习项目）"
license = "GPL-3.0-only"
repository = "https://github.com/YoisakiKnd/congminal"

[features]
default = ["sftp"]
# 三平台内置 SFTP；点击连接前不创建工作池、线程或 SSH 连接。
sftp = ["ssh-auth-helper"]
# 保留旧验收工具及构建命令兼容。
sftp-preview = ["sftp"]
# M6 受限原生后端；尚未加入默认发布路径，评估见 docs/evaluations/m6-sftp.md。
sftp-libssh2 = ["dep:libssh2-sys"]
# 按需认证及 Windows 文件打开 helper；随默认安装包分发。
ssh-auth-helper = []
# 本地目录隔离候选的开发/成本入口；不替换正常浏览后端。
directory-helper = []

[[bin]]
name = "congminal-ssh-helper"
path = "src/ssh/helper_main.rs"
required-features = ["ssh-auth-helper"]

[dependencies]
libssh2-sys = { version = "=0.3.3", optional = true, default-features = false }

# Reuse the locked FFI definitions for fixed-size native monitor reads.
[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191" }

[profile.release]
debug = 1

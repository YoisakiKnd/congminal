# congminal 配置文件
#
# 位置：
#   macOS / Linux：~/.config/congminal/congminal.toml（设置了 XDG_CONFIG_HOME 时在它下面）
#   Windows：%APPDATA%\congminal\congminal.toml
#   也可以用 --config <路径> 或环境变量 CONGMINAL_CONFIG 指定。
#
# 这份文件里写的都是默认值，只需要保留你想改的部分。
# 保存后自动生效（字体、主题、颜色、快捷键、内边距、光标、Option 键）；shell、窗口大小、布局恢复和内存额度在下次启动时生效。
# 用 congminal --print-config 可以重新打印这份文件。

[font]
# 依次尝试，用第一个找得到的；其余的在缺字时作为后备。
# 都找不到时用系统等宽字体（Menlo / Consolas / DejaVu Sans Mono），最后是内置的点阵字体。
# 也可以写字体文件的路径。
family = ["Maple Mono NF CN", "Maple Mono NF", "Maple Mono CN", "Maple Mono"]
# 字号（逻辑像素，高分屏上会自动放大）
size = 15
# 行高倍数，1.0 是字体自己的行高
line-height = 1.0
# 编程连字：-> => != 这类符号显示成连起来的样子（Maple Mono、Fira Code、JetBrains Mono 等字体支持）
ligatures = true

[window]
# 启动时的列数和行数
columns = 80
rows = 24
# 文字和窗口边缘之间的空白（逻辑像素）
padding = 4

[workspace]
# 开启后异步保存/恢复标签、分屏、焦点和侧栏；默认关闭，不增加布局 I/O 或线程。
# 文件在当前配置旁，名称为 <配置文件名>.workspace（不同配置分别保存）。
# 只保存 UI 元数据，不含路径、标题、命令、终端文本或输入；恢复时重新启动当前配置的 shell。
# 若已开始输入/点击则取消迟到的恢复。删除 .workspace 文件即可重置布局。
restore-layout = false

# SFTP 需 macOS/Linux 的 sftp-preview 构建；普通构建启用会提示不支持。
# 启用只开放 SSH 会话文件页的“连接”按钮，点击前不创建池、工作器或连接。
[sftp]
enabled = false
# 默认查找主程序旁的 congminal-ssh-helper；密码/私钥正文不要写入配置。
# helper = "/absolute/path/congminal-ssh-helper"
# 不写时沿用系统 SSH 配置；以下设置只影响独立 SFTP，不改变终端 ssh 命令。
# ssh-config = "/absolute/path/ssh_config"

# 本地只读 Git 面板（右栏 Git 页，Primary+I 打开右栏后点标签）。
# 只执行 rev-parse/status/symbolic-ref/diff，不改索引、不执行任何写操作。
# 面板可见且窗口聚焦时才查询：切换焦点/窗口变化后去抖 0.3 秒，
# 两次查询至少间隔 refresh-seconds；同仓库的多个窗格复用同一份结果。
[git]
enabled = true
# 不写时用 PATH 中的 git；也可以写绝对路径。
# program = "/usr/bin/git"
refresh-seconds = 2
# 单次查询超时，超时会杀掉子进程并保留上一次结果。
timeout-seconds = 20
# 一次快照最多列出多少个变更文件，超出标记“已截断”。
max-files = 2000
# 单次 diff 的读取上限（MiB），超出部分丢弃并提示已截断。
diff-mib = 8

# 本地状态监控（右栏“监控”页）：CPU、内存、磁盘。
# 面板可见且窗口聚焦时才采样；隐藏或失焦即停止并保留最近历史。
[monitor]
enabled = true
# CPU/内存采样间隔（秒），1–5。
interval-seconds = 1
# 历史保留时长（秒），60–900；换算成定长环形队列。
history-seconds = 300
# 磁盘刷新间隔（秒），5–120；磁盘刷新比 CPU/内存贵一个数量级。
disk-seconds = 10

[memory]
# 共享准入额度，128–4096 MiB；不是完整堆/RSS 上限。下次启动生效。
# 当前计入：画布容量/扩容峰值、PTY 队列容量预留、字形缓存计费、字体堆回退。
# 网格容量及缩放临时工作集另作保守预留；额度不足时保留旧尺寸。
# 持久历史、字体解析/解码临时缓冲和缓存索引尚未完整接入，非完整堆/RSS 上限。
managed-mib = 512
# 字体只读映射单独限制地址空间，64–4096 MiB、最多 128 个映射，不计作堆/RSS。
mapped-font-mib = 1024

[appearance]
# dark、light、midnight；快捷键 Primary+F6 循环切换（不写回文件）。
theme = "dark"

[colors]
# 显式设置的颜色覆盖主题，并在切换主题时保留；以下展示 dark 的默认值。
# foreground = "#d8d8d8"
# background = "#1e1e1e"
# cursor = "#e0e0e0"
# cursor-text = "#1e1e1e"
# selection-background = "#264f78"
# preedit-background = "#3a3d41"
# bold-is-bright = true
# palette = ["#000000", "#cd3131"] # 最多 256 项，依次覆盖调色板

[keybindings]
# Primary 在 macOS 是 Cmd，其他平台是 Ctrl+Shift。键名不区分大小写。
# 默认：Primary+C/V 复制/粘贴，Primary+Equal/Plus/Minus/0 缩放/复位，
# Primary+F6 切换主题，Primary+F12 显示资源统计。
# Primary+F 打开搜索，Enter/F3 下一项，Shift+Enter/Shift+F3 上一项，Esc 退出。
# 链接：macOS Cmd+单击，其他平台 Ctrl+单击；加 Shift 复制目标。
# Shift+PageUp/PageDown/Home/End 浏览历史（备用屏幕交给程序）。
# "Primary+Equal" = "font-increase"
# "Primary+Minus" = "font-decrease"
# "Primary+0" = "font-reset"
# "Primary+F6" = "next-theme"
# "Ctrl+Shift+X" = { action = "send-text", text = "hello" }
# "Primary+C" = "pass-through" # 交给终端程序；none 表示忽略
# 支持 copy、paste、page-up、page-down、history-top、history-bottom、
# font-increase、font-decrease、font-reset、next-theme、show-resources、
# search、search-next、search-previous、open-link、copy-link。

[cursor]
# block（方块）、underline（下划线）或 bar（竖线）。程序可以临时改变它。
shape = "block"

[scrollback]
# 回滚历史保留多少行。滚轮或 Shift+PageUp / Shift+PageDown 往回看，0 表示不保留。
lines = 10000

[shell]
# 不写 program 时：macOS / Linux 用 $SHELL，Windows 用 %COMSPEC%
# program = "/bin/zsh"
# args = ["-l"]
# 不写时继承启动 congminal 的目录。~ 表示用户主目录。
# working-directory = "~"

[env]
# 额外的环境变量。TERM 默认是 xterm-256color。
# LANG = "zh_CN.UTF-8"

[macos]
# 把 Option 键当作 Alt 用（发送 ESC 前缀，方便 shell 和 vim 的快捷键）。
# true / false，或者 "left" / "right" 只让一边的 Option 当 Alt，另一边照常输入特殊字符。
option-as-alt = true

# 应用内通知默认开启；system 仅在显式启用后调用系统工具。
# 系统适配：macOS osascript / Linux notify-send / Windows PowerShell .NET NotifyIcon。
# 调用有 5 秒超时、每 10 秒最多一次，失败在通知中心显示；不会发送命令、路径或输出正文。
[notifications]
# 按主机静音：命中这些主机名的通知完全不产生（大小写不敏感，最多 32 个）。
# 主机名取自 shell 报告的 OSC 7 目录或 SSH 配置档；本地命令、本地 Git 与监控没有主机维度。
# mute-hosts = ["web-1", "db.example.com"]
# SFTP 候选入口启用后，控制传输结局通知；不包含文件路径或主机名。
transfers = true
# Git 写操作与监控采样失败的通知；关掉后对应事件不再进通知中心。
git = true
monitor = true
muted = false
system = false
failures = true
long-commands = true
background = true
long-seconds = 10
# 同类事件（Git 写、监控失败）在该秒数内合并成一条并累加次数；0 表示不合并。
dedupe-seconds = 5
# 10 秒窗口内最多产生多少条本地通知，超出只计数不排队。
burst = 12
# 隐藏状态栏与右栏状态页里的主机名、工作目录等敏感上下文（通知本身只含固定动作词）。
hide-context = false

# 工作区快捷键（Primary：macOS 为 Cmd，其他为 Ctrl+Shift）：
# Primary+T=new-tab，Primary+W=close-pane，Ctrl+Tab/Shift+Ctrl+Tab 切换标签。
# Primary+D=split-right，Primary+Enter=split-down，Ctrl+PageDown=next-pane。
# Ctrl+PageUp=previous-pane，Ctrl+Shift+PageUp/PageDown 重排标签。
# Primary+B=toggle-left-sidebar，Primary+I=toggle-right-sidebar。
# 可在已有 [keybindings] 中覆盖；跨运行保存须启用 [workspace] restore-layout。

# 左栏“连接”页读取命名配置档，最多 16 个；点击本地配置档新建标签。
# 所有名称/路径/参数有长度上限，不保存密码或私钥正文。
# 本地 working-directory 使用启动目录相对路径或绝对路径，不展开 ~ 或环境变量。
# [connections.dev]
# kind = "local"
# name = "开发终端"
# group = "本机"
# program = "/bin/zsh"
# args = ["-l"]
# working-directory = "/absolute/project/path"
# theme = "midnight" # 关联元数据；按会话应用主题将在美化阶段接入
#
# SSH：点击配置档新建 OpenSSH PTY 会话；连接页“重连”使用原会话快照。
# 工具检查在后台运行；认证/主机确认保留在终端，认证/活动状态无法可靠判断时显示未知。
# 系统 OpenSSH 为可选外部工具；跨平台真机与长测仍待验收。
# host 可填写系统 SSH 配置中的明确别名，也可填写主机名/IP，禁止通配符和选项。
# [connections.build]
# kind = "ssh"
# name = "构建主机"
# group = "远程"
# host = "build-alias"
# user = "builder"
# port = 22
# identity-file = "/absolute/key/path" # 配置只保存路径，由 OpenSSH 读取密钥
# program = "/usr/bin/ssh" # 外部后端候选的程序路径
